name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bsdtar, desktop validator + test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools desktop-file-utils
          bsdtar --version
          desktop-file-validate Install-MGS-Mods.desktop
          # Keep CI deterministic: newer Ruff releases can add new default
          # rules and turn an otherwise green release into a lint failure.
          python -m pip install --upgrade pip pytest ruff==0.15.13

      - name: Byte-compile the installer
        run: python -m py_compile install.py

      - name: Run lint
        run: ruff check .

      - name: Run the test-suite
        run: python -m pytest tests/ -q

  test-windows:
    # The Windows port is real, so it gets real CI: dialogs are mocked by the
    # suite, but discovery, transactions, archive handling (via System32's
    # tar.exe, which is bsdtar) and the audio classifier all run natively.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Confirm Windows tar is bsdtar
        run: tar --version

      - name: Run the test-suite
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/ -q
