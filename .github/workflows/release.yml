name: Release

# Push a tag like `v1.1.0` to cut an immutable release. The installer shortcut
# (Install-MGS-Mods.desktop) downloads install.py from the release created here
# and verifies its SHA-256, so users always run a fixed, checksummed installer
# rather than the moving `main`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    # Reusable CI checks out github.sha: Linux AND Windows test the tagged commit.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify BOTH shortcuts pin THIS tag and THIS install.py
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          FILE_SHA=$(sha256sum install.py | cut -d' ' -f1)
          echo "release tag      : $TAG"
          echo "install.py sha256: $FILE_SHA"
          check() {  # check <file> <pin_tag> <pin_sha>
            echo "$1: TAG=$2 SHA=$3"
            if [ "$2" != "$TAG" ]; then
              echo "::error::$1 pins TAG=$2 but this release is $TAG"; exit 1
            fi
            if [ "$3" != "$FILE_SHA" ]; then
              echo "::error::$1 pins SHA=$3 but install.py is $FILE_SHA"; exit 1
            fi
          }
          check Install-MGS-Mods.desktop \
            "$(grep -oP 'TAG=\K[^;]+' Install-MGS-Mods.desktop)" \
            "$(grep -oP 'SHA=\K[0-9a-f]{64}' Install-MGS-Mods.desktop)"
          check Install-MGS-Mods.cmd \
            "$(grep -oP 'set "TAG=\K[^"]+' Install-MGS-Mods.cmd | tr -d '\r')" \
            "$(grep -oP 'set "SHA=\K[0-9a-f]{64}' Install-MGS-Mods.cmd)"
          echo "OK: both shortcuts match this release's tag and install.py"

      - name: Generate checksums
        run: |
          cat "docs/releases/${GITHUB_REF_NAME}.md" > notes.md
          sha256sum install.py Install-MGS-Mods.desktop Install-MGS-Mods.cmd > SHA256SUMS
          {
            echo "## Installer checksum"
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo "Both shortcuts' embedded tag + SHA-256 were verified against install.py in CI."
          } >> notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            install.py
            Install-MGS-Mods.desktop
            Install-MGS-Mods.cmd
            SHA256SUMS
          body_path: notes.md
